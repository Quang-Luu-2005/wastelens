<div id="camera">
  <div class="controls">
    <button id="start">Bật camera</button><button id="stop" disabled>Dừng camera</button>
    <select id="devices" aria-label="Chọn camera"><option value="">Camera mặc định</option></select>
  </div>
  <div id="stage"><video autoplay muted playsinline></video><canvas id="overlay" aria-label="Khung bao vật được phát hiện; nhấp để chọn vật"></canvas>
    <p id="placeholder">Bật camera để phát hiện và phân loại từng vật.</p></div>
  <p id="status" role="status">Camera chưa bật.</p>
</div>
